# Electrical calculation suite: app + optional Cap CAPTCHA.
#
#   docker compose up -d                     # app only, CAPTCHA disabled
#   docker compose --profile captcha up -d   # app + Cap (see README for the site key)
#
# Copy .env.example to .env and set AUTH_PASSWORD (and CAP_* when using the profile).

name: electricacl

services:
  app:
    image: ghcr.io/ashcoft/electricacl:latest
    build:
      context: .
    container_name: electricacl
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      # Leave empty to let the service generate a password on first boot and
      # print it to `docker compose logs app`.
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # CAPTCHA: either a public Cap instance (CAP_API_ENDPOINT + CAP_SECRET)
      # or the bundled Cap container through the app's /cap proxy
      # (CAP_UPSTREAM + CAP_SITE_KEY + CAP_SECRET).
      CAP_API_ENDPOINT: ${CAP_API_ENDPOINT:-}
      CAP_UPSTREAM: ${CAP_UPSTREAM:-}
      CAP_SITE_KEY: ${CAP_SITE_KEY:-}
      CAP_SECRET: ${CAP_SECRET:-}
      RUST_LOG: ${RUST_LOG:-electricacl=info,tower_http=warn}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/electricacl", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cap:
    image: tiago2/cap:4
    profiles: ["captcha"]
    # Create a site once with:
    #   ADMIN_KEY=$CAP_ADMIN_KEY ./tools/cap_create_site.sh electricacl
    # then set CAP_SITE_KEY / CAP_SECRET and CAP_UPSTREAM=http://cap:3000
    container_name: electricacl-cap
    restart: unless-stopped
    ports:
      - "${CAP_PORT:-3000}:3000"
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:?set CAP_ADMIN_KEY in .env (at least 12 characters)}
      VALKEY_URL: redis://valkey:6379
    volumes:
      - cap-data:/usr/src/app/data
    depends_on:
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:9-alpine
    profiles: ["captcha"]
    container_name: electricacl-cap-valkey
    restart: unless-stopped
    command: >
      valkey-server
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --maxmemory-policy noeviction
      --loglevel warning
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  app-data:
  cap-data:
  valkey-data:
